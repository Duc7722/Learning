<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>strong,b,em,i,u</title>
  </head>
  <body>
    <p>
      <!-- In đậm và nhấn mạnh -->
      Họ tên: <strong>Diệp Minh Đức</strong>
      <br />
      <!-- Chỉ in đậm -->
      Sinh ngày: <b>7/7/2002</b>
      <br />
      <!-- In nghiên và nhấn mạnh -->
      Ngành: <em>Tự động hoá</em>
      <br />
      <!-- Chỉ in nghiêng -->
      Công việc: <i>R&D Engineer</i>
      <br />
      Địa chỉ: <i><b>Hai Nam Automation Technology JSC.</b></i>
      <br />
    </p>
  </body>
</html>
